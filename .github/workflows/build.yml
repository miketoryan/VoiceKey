name: Build

concurrency:
  group: voicekey-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project VoiceKey.xcodeproj \
            -scheme VoiceKey \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive unsigned iPhone app
        run: |
          xcodebuild \
            -project VoiceKey.xcodeproj \
            -scheme VoiceKey \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VoiceKey.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package IPA for Sideloadly
        run: |
          APP_PATH="$RUNNER_TEMP/VoiceKey.xcarchive/Products/Applications/VoiceKey.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/voicekey-ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/voicekey-ipa/Payload/VoiceKey.app"
          cd "$RUNNER_TEMP/voicekey-ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload VoiceKey-unsigned.ipa
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mv VoiceKey-unsigned.ipa "$GITHUB_WORKSPACE/artifacts/VoiceKey-unsigned.ipa"

      - name: Upload VoiceKey IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceKey-unsigned
          path: artifacts/VoiceKey-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
